name: Release

# Push a tag that matches package.json on main, after the version-bump PR is merged:
#   git tag v0.1.1 origin/main && git push origin v0.1.1
# Publishes the Docker image to GitHub Container Registry (ghcr.io/<owner>/<repo>) for amd64 and arm64,
# and the npm package through npm trusted publishing (OIDC: no token; the package's npm settings name this
# repository and release.yml as its trusted publisher). npm adds a provenance attestation automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write # OIDC token for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest # trusted publishing works on GitHub-hosted runners only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No dependency cache in a release build: a poisoned cache would end up in the published package.
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Publish to npm (trusted publishing)
        run: |
          # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
          npm install -g npm@^11.5.1
          npm publish --access public

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
