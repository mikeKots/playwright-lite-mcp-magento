name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Catches a broken Dockerfile or a Playwright image tag that no longer matches package.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t playwright-lite-mcp:ci .
      - name: Server starts in the image
        run: |
          echo '' | docker run -i --rm -e PW_ALLOWED_ORIGINS=https://example.com playwright-lite-mcp:ci 2>&1 | tee out.log
          grep -q '"server ready"' out.log
      - name: HTTP transport starts in the image
        run: |
          docker run -d --name mcp-http -p 8940:8940 -e PW_ALLOWED_ORIGINS=https://example.com \
            -e MCP_TRANSPORT=http -e MCP_HTTP_HOST=0.0.0.0 -e MCP_HTTP_TOKEN=ci-token-0123456789abcdef \
            playwright-lite-mcp:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8940/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8940/mcp -d '{}')" = 401
          docker logs mcp-http 2>&1 | grep -q '"server ready"'
          docker rm -f mcp-http
